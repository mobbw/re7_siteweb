<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="header_contain">
        <nav class="header_gauche">
          <ul>
            <li><a href="index.html">MENU</a></li>
          </ul>
        </nav>

        <div class="header_image">
          <a href="index.html">
            <img src="assets/Logo_RE7_avec_toque_de_chef.svg" alt="logo re7" />
          </a>
        </div>

        <nav class="header_droite">
          <ul>
            <li><a href="#recherche">RECHERCHE</a></li>
            <li><a href="#blog">BLOG</a></li>
            <li><a href="apropos.html">CONNEXION</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="recette">
        <div class="presentation_recette">
          <h1>Crêpe</h1>
          <p>Des crêpes rapide et facile à faire !</p>
          <div class="border">
            <div class="affichage_pictogrammes">
              <img src="assets/pictogramme-prix-euro.svg" alt="pictogramme1" />
              <img
                src="assets/pictogramme-tres-facile.svg"
                alt="pictogramme2"
              />
              <img
                src="assets/echelle-nutritionnelle-D.svg"
                alt="pictogramme3"
              />
            </div>
          </div>
          <div class="border fondrose">
            <h3>Résumé</h3>
            <div class="affichage_pictogrammes">
              <img src="assets/preparation-10-minutes.svg" alt="pictogramme4" />
              <img src="assets/cuisson-15-minutes.svg" alt="pictogramme5" />
              <img src="assets/calories-110-kcal.svg" alt="pictogramme6" />
            </div>
          </div>
          <div class="border">
            <h3>Ingrédients</h3>
            <div class="affichage_pictogrammes ingredients">
              <img src="assets/farine.svg" alt="ingredient1" />
              <img src="assets/huile.svg" alt="ingredient2" />
              <img src="assets/lait.svg" alt="ingredient3" />
              <img src="assets/oeufs.svg" alt="ingredient3" />
              <img src="assets/sel.svg" alt="ingredient3" />
              <img src="assets/sucre.svg" alt="ingredient3" />
            </div>
          </div>
          <div class="border">
            <h3>Recette</h3>
            <figure>
              <div class="afficher_recette">
                <img src="assets/farine.svg" alt="image ingredient" />
                <figcaption>
                  1/ Verser la farine, le sucre et le sel dans un cul de poule
                  puis mélanger les ingrédients secs avec un fouet pour
                  homogénéiser.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/oeufs.svg" alt="image ingredient" />
                <figcaption>
                  2/ Ajouter les œufs et incorporer l’huile.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/lait.svg" alt="image ingredient" />
                <figcaption>
                  3/ Verser le lait progressivement en fouettant pour éviter les
                  grumeaux afin d'obtenir une pâte fluide, lisse et homogène.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/lait.svg" alt="image ingredient" />
                <figcaption>
                  4/ Laisser reposer la pâte au minimum 1 heure à température
                  ambiante.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/huile.svg" alt="image ingredient" />
                <figcaption>
                  5/ Chauffer une poêle ou une crêpière légèrement huilée.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/sel.svg" alt="image ingredient" />
                <figcaption>
                  6/ Verser une louche de pâte et répartir uniformément.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/sucre.svg" alt="image ingredient" />
                <figcaption>
                  7/ Cuire chaque crêpe 1 à 2 minutes de chaque côté jusqu’à
                  légère coloration.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/crepe.png" alt="image ingredient" />
                <figcaption>
                  8/ Réserver les crêpes au chaud et répéter l’opération avec le
                  reste de pâte.
                </figcaption>
              </div>
            </figure>
          </div>
          <footer>
            <nav>
              <ul>
                <li><a href="apropos.html" target="_blank">A propos</a></li>
                <li>
                  <a href="#contact">Nous contactez</a>
                </li>
                <li>2026 &copy; RE7</li>
              </ul>
            </nav>
          </footer>
        </div>
        <div class="image_recette">
          <img src="assets/crepe.png" alt="image du plat" />
        </div>
      </section>
    </main>
  </body>
</html>
