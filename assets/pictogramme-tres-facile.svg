<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="320" height="240" role="img" aria-label="Niveau de difficulté : très facile" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Trois barres croissantes : la première est mise en avant, les deux autres sont atténuées -->
  <rect x="55" y="46" width="12" height="18" rx="6" fill="#2F55D4"/>
  <rect x="74" y="34" width="12" height="30" rx="6" fill="#C9D3EC"/>
  <rect x="93" y="22" width="12" height="42" rx="6" fill="#C9D3EC"/>

  <!-- Petit socle sous les barres -->
  <rect x="49" y="70" width="62" height="2.5" rx="1.25" fill="#2F55D4" fill-opacity=".25"/>

  <text x="80" y="98" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing=".3" fill="#1B2A5C">Très facile</text>
</svg>
