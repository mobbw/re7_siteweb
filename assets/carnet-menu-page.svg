<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Page de carnet de menu" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="papier" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e6b8"/>
      <stop offset="1" stop-color="#efd59a"/>
    </linearGradient>
    <linearGradient id="reliure" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="ombre" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2a1608" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Couverture marron -->
  <rect x="30" y="30" width="540" height="740" rx="12" fill="#4a2a14" filter="url(#ombre)"/>

  <!-- Page -->
  <rect x="48" y="46" width="506" height="708" rx="4" fill="url(#papier)"/>

  <!-- Ombre de reliure à gauche -->
  <rect x="48" y="46" width="70" height="708" fill="url(#reliure)"/>

  <!-- Filets : marron épais + orange fin -->
  <rect x="86" y="84" width="440" height="632" fill="none" stroke="#5a3418" stroke-width="3"/>
  <rect x="96" y="94" width="420" height="612" fill="none" stroke="#d9731f" stroke-width="1.5"/>

  <!-- Coins décoratifs -->
  <g fill="#a8321e">
    <path d="M86 84 h34 a34 34 0 0 1 -34 34 z"/>
    <path d="M526 84 h-34 a34 34 0 0 0 34 34 z"/>
    <path d="M86 716 h34 a34 34 0 0 0 -34 -34 z"/>
    <path d="M526 716 h-34 a34 34 0 0 1 34 -34 z"/>
  </g>

  <!-- Ornement d'en-tête -->
  <g stroke="#5a3418" stroke-width="2" stroke-linecap="round">
    <line x1="190" y1="150" x2="285" y2="150"/>
    <line x1="315" y1="150" x2="410" y2="150"/>
  </g>
  <path d="M300 138 l12 12 l-12 12 l-12 -12 z" fill="#a8321e"/>
  <circle cx="300" cy="150" r="3.5" fill="#f7e6b8"/>

  <!-- Zone de texte : repères discrets, à retirer si tu veux -->
  <g stroke="#b98a52" stroke-opacity=".6" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round">
    <line x1="140" y1="230" x2="460" y2="230"/>
    <line x1="140" y1="272" x2="460" y2="272"/>
    <line x1="140" y1="314" x2="460" y2="314"/>
    <line x1="140" y1="356" x2="460" y2="356"/>
    <line x1="140" y1="398" x2="460" y2="398"/>
    <line x1="140" y1="440" x2="460" y2="440"/>
    <line x1="140" y1="482" x2="460" y2="482"/>
    <line x1="140" y1="524" x2="460" y2="524"/>
    <line x1="140" y1="566" x2="460" y2="566"/>
    <line x1="140" y1="608" x2="460" y2="608"/>
  </g>

  <!-- Ornement de pied -->
  <g stroke="#5a3418" stroke-width="2" stroke-linecap="round">
    <line x1="230" y1="662" x2="285" y2="662"/>
    <line x1="315" y1="662" x2="370" y2="662"/>
  </g>
  <circle cx="300" cy="662" r="5" fill="#d9731f"/>
</svg>
