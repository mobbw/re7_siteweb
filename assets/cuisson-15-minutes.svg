<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 165" width="330" height="330" role="img" aria-label="15 minutes de cuisson" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="165" height="165" fill="#FFADAD"/>

  <!-- Casserole et vapeur -->
  <g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- vapeur -->
    <path d="M 71 22 q -4 4 0 8 q 4 4 0 8"/>
    <path d="M 82 20 q -4 4 0 8 q 4 4 0 8"/>
    <path d="M 93 22 q -4 4 0 8 q 4 4 0 8"/>
    <!-- couvercle -->
    <path d="M 66 46 H 98"/>
    <!-- corps -->
    <path d="M 68 46 V 56 Q 68 68 79 68 H 85 Q 96 68 96 56 V 46"/>
    <!-- poignées -->
    <path d="M 58 52 H 68"/>
    <path d="M 96 52 H 106"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#111">
    <text x="82" y="108" font-size="23" font-weight="500">15 minutes</text>
    <text x="82" y="131" font-size="15.5" font-weight="700">Cuisson</text>
  </g>
</svg>
