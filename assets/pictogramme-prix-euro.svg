<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="440" height="240" role="img" aria-label="Niveau de prix : un euro sur trois" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#1B3FB8"/>
    </linearGradient>
    <!-- Symbole euro : arc ouvert à droite + deux barres -->
    <g id="euro" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6.4 -7.6 A 10 10 0 1 0 6.4 7.6"/>
      <path d="M -14 -3 H 5.5"/>
      <path d="M -14 3 H 5.5"/>
    </g>
  </defs>

  <!-- Badge : forme en pilule à coins doux, liseré pointillé intérieur -->
  <rect x="10" y="12" width="200" height="96" rx="48" fill="url(#fond)"/>
  <rect x="18" y="20" width="184" height="80" rx="40" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"/>

  <!-- Un euro mis en avant, deux grisés -->
  <use href="#euro" x="63" y="60" style="color:#FFFFFF"/>
  <use href="#euro" x="110" y="60" style="color:#A9B8DC; opacity:.55"/>
  <use href="#euro" x="157" y="60" style="color:#A9B8DC; opacity:.55"/>
</svg>
