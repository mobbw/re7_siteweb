<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="header_contain">
        <nav class="header_gauche">
          <ul>
            <li><a href="index.html">MENU</a></li>
          </ul>
        </nav>

        <div class="header_image">
          <a href="index.html">
            <img src="assets/Logo_RE7_avec_toque_de_chef.svg" alt="logo re7" />
          </a>
        </div>

        <nav class="header_droite">
          <ul>
            <li><a href="#recherche">RECHERCHE</a></li>
            <li><a href="#blog">BLOG</a></li>
            <li><a href="apropos.html">CONNEXION</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="recette">
        <div class="presentation_recette">
          <h1>Fondant au chocolat</h1>
          <p>Un fondant rapide et facile à faire !</p>
          <div class="border">
            <div class="affichage_pictogrammes">
              <img src="assets/pictogramme-prix-euro.svg" alt="pictogramme1" />
              <img
                src="assets/pictogramme-tres-facile.svg"
                alt="pictogramme2"
              />
              <img
                src="assets/echelle-nutritionnelle-E.svg"
                alt="pictogramme3"
              />
            </div>
          </div>
          <div class="border fondrose">
            <h3>Résumé</h3>
            <div class="affichage_pictogrammes">
              <img src="assets/preparation-10-minutes.svg" alt="pictogramme4" />
              <img src="assets/cuisson-25-minutes.svg" alt="pictogramme5" />
              <img src="assets/calories-380-kcal.svg" alt="pictogramme6" />
            </div>
          </div>
          <div class="border">
            <h3>Ingrédients</h3>
            <div class="affichage_pictogrammes ingredients">
              <img src="assets/beurre2.svg" alt="ingredient1" />
              <img src="assets/chocolat2.svg" alt="ingredient2" />
              <img src="assets/farine2.svg" alt="ingredient3" />
              <img src="assets/oeufs2.svg" alt="ingredient3" />
              <img src="assets/sucre2.svg" alt="ingredient3" />
            </div>
          </div>
          <div class="border">
            <h3>Recette</h3>
            <figure>
              <div class="afficher_recette">
                <img src="assets/beurre2.svg" alt="image ingredient" />
                <figcaption>
                  1/ Préchauffez le four à 160°C. Commencez par bien fouetter le
                  beurre. Ajoutez-y le sucre et fouettez bien jusqu’à obtenir
                  une consistance crémeuse.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/oeufs2.svg" alt="image ingredient" />
                <figcaption>
                  2/ Ajoutez y 1 oeuf et fouettez. Ajoutez 1 cuillère à soupe de
                  farine et fouettez à nouveau.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/farine2.svg" alt="image ingredient" />
                <figcaption>
                  3/ Ajoutez ensuite le deuxième oeuf et fouettez. Ajoutez la
                  deuxième cuillère de farine et fouettez. Ajoutez ensuite le
                  dernier oeuf et fouettez.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/chocolat2.svg" alt="image ingredient" />
                <figcaption>
                  4/ Faites ensuite fondre le chocolat au micro-ondes (ou au
                  bain marie) et ajoutez-le à la préparation puis fouettez.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/sucre2.svg" alt="image ingredient" />
                <figcaption>
                  5/ Versez la préparation dans un moule chemisé de papier
                  sulfurisé. Enfournez pour 25 minutes à 160°C.
                </figcaption>
              </div>
              <div class="afficher_recette">
                <img src="assets/fondant.png" alt="image ingredient" />
                <figcaption>
                  6/ À la sortie du four, laissez le fondant au chocolat
                  refroidir avant de le démouler et le couper.
                </figcaption>
              </div>
            </figure>
          </div>
          <footer>
            <nav>
              <ul>
                <li><a href="apropos.html" target="_blank">A propos</a></li>
                <li>
                  <a href="contacts.html" target="_blank">Nous contactez</a>
                </li>
                <li>2026 &copy; RE7</li>
              </ul>
            </nav>
          </footer>
        </div>
        <div class="image_recette">
          <img src="assets/fondant.png" alt="image du plat" />
        </div>
      </section>
    </main>
  </body>
</html>
